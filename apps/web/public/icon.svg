<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ultra-minimalist Flip Logo -->
  <rect width="512" height="512" rx="128" fill="#0052cc"/>
  
  <!-- Base card (bottom) -->
  <rect x="156" y="156" width="200" height="200" rx="16" fill="white" fill-opacity="0.3"/>
  
  <!-- Flipped card (top) -->
  <rect x="180" y="130" width="200" height="200" rx="16" fill="white"/>
  
  <!-- Accent line to suggest flipping -->
  <path d="M180 130L156 156" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
</svg>
